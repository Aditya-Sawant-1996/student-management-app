<section class="h-full max-h-[calc(100vh-100px)] overflow-y-auto p-6">
  <div class="mb-6 flex flex-col gap-1">
    <div class="text-xs uppercase tracking-[0.32em] text-gray-400 dark:text-gray-500">Settings</div>
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">Change Password</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">
      Request an OTP and set a new password for the system user.
    </p>
  </div>

  <div class="max-w-xl rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 p-6 shadow-sm">
    <form [formGroup]="changeForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">
          Email
        </label>
        <input
          type="email"
          formControlName="email"
          class="mt-2 w-full rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm text-gray-800 focus:border-sky-500 focus:outline-none dark:border-gray-700 dark:bg-gray-950 dark:text-gray-100"
          placeholder="Enter email"
        />
        <p
          *ngIf="changeForm.get('email')?.invalid && changeForm.get('email')?.touched"
          class="mt-1 text-xs text-rose-500"
        >
          Please enter a valid email.
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-full bg-sky-600 px-4 py-2 text-xs font-semibold text-white hover:bg-sky-700 transition-colors disabled:opacity-60"
          (click)="onSendOtp()"
          [disabled]="isSubmitting"
        >
          <mat-icon class="text-sm">mail</mat-icon>
          Send OTP
        </button>
        <span class="text-xs text-gray-500 dark:text-gray-400" *ngIf="otpSent">
          OTP sent. Check your email.
        </span>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">
          OTP
        </label>
        <input
          type="text"
          formControlName="otp"
          class="mt-2 w-full rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm text-gray-800 focus:border-sky-500 focus:outline-none dark:border-gray-700 dark:bg-gray-950 dark:text-gray-100"
          placeholder="Enter OTP"
        />
        <p
          *ngIf="changeForm.get('otp')?.invalid && changeForm.get('otp')?.touched"
          class="mt-1 text-xs text-rose-500"
        >
          OTP is required (min 6 digits).
        </p>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">
          New Password
        </label>
        <div class="relative mt-2">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            class="w-full rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm text-gray-800 focus:border-sky-500 focus:outline-none dark:border-gray-700 dark:bg-gray-950 dark:text-gray-100"
            placeholder="Enter new password"
          />
          <button
            type="button"
            class="absolute right-3 top-2 text-xs text-gray-500"
            (click)="showNewPassword = !showNewPassword"
          >
            {{ showNewPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <p
          *ngIf="changeForm.get('newPassword')?.invalid && changeForm.get('newPassword')?.touched"
          class="mt-1 text-xs text-rose-500"
        >
          New password is required.
        </p>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">
          Confirm Password
        </label>
        <div class="relative mt-2">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            class="w-full rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm text-gray-800 focus:border-sky-500 focus:outline-none dark:border-gray-700 dark:bg-gray-950 dark:text-gray-100"
            placeholder="Confirm new password"
          />
          <button
            type="button"
            class="absolute right-3 top-2 text-xs text-gray-500"
            (click)="showConfirmPassword = !showConfirmPassword"
          >
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <p
          *ngIf="changeForm.hasError('passwordMismatch') && changeForm.get('confirmPassword')?.touched"
          class="mt-1 text-xs text-rose-500"
        >
          Passwords do not match.
        </p>
      </div>

      <div>
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-full bg-emerald-600 px-5 py-2 text-xs font-semibold text-white hover:bg-emerald-700 transition-colors disabled:opacity-60"
          (click)="onChangePassword()"
          [disabled]="isSubmitting"
        >
          <mat-icon class="text-sm">lock_reset</mat-icon>
          Update Password
        </button>
      </div>
    </form>
  </div>
</section>
