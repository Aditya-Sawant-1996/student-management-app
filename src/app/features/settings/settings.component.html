<section class="h-full overflow-y-auto p-6">
  <div class="mb-6 flex flex-col gap-1">
    <div class="text-xs uppercase tracking-[0.32em] text-gray-400 dark:text-gray-500">Settings</div>
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">Manage your workspace</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">
      Quick access to essential configuration areas.
    </p>
  </div>

  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
    <ng-container *ngFor="let card of cards">
      <ng-container *ngIf="card.show">
        <a
          *ngIf="card.route; else staticCard"
          [routerLink]="card.route"
          class="group block relative overflow-hidden rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm transition-all hover:-translate-y-1 hover:shadow-md"
        >
          <div class="p-5">
            <div class="flex items-center justify-between">
              <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gray-100 dark:bg-gray-800">
                <mat-icon class="text-2xl" [ngClass]="card.iconClass">{{ card.icon }}</mat-icon>
              </div>
              <span class="rounded-full bg-gray-100 dark:bg-gray-800 px-3 py-1 text-[10px] font-semibold uppercase tracking-widest text-gray-500 dark:text-gray-300">
                Active
              </span>
            </div>
            <div class="mt-4 text-lg font-semibold text-gray-800 dark:text-gray-100">
              {{ card.label }}
            </div>
            <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
              {{ card.description }}
            </p>
            <div class="mt-4 inline-flex items-center gap-2 text-xs font-semibold text-gray-600 dark:text-gray-300">
              <span>Open</span>
              <mat-icon class="text-sm">east</mat-icon>
            </div>
          </div>
        </a>
        <ng-template #staticCard>
          <div
            class="group relative overflow-hidden rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm transition-all hover:-translate-y-1 hover:shadow-md"
          >
            <div class="p-5">
              <div class="flex items-center justify-between">
                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gray-100 dark:bg-gray-800">
                  <mat-icon class="text-2xl" [ngClass]="card.iconClass">{{ card.icon }}</mat-icon>
                </div>
                <span class="rounded-full bg-gray-100 dark:bg-gray-800 px-3 py-1 text-[10px] font-semibold uppercase tracking-widest text-gray-500 dark:text-gray-300">
                  Active
                </span>
              </div>
              <div class="mt-4 text-lg font-semibold text-gray-800 dark:text-gray-100">
                {{ card.label }}
              </div>
              <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
                {{ card.description }}
              </p>
              <div class="mt-4 inline-flex items-center gap-2 text-xs font-semibold text-gray-600 dark:text-gray-300">
                <span>Open</span>
                <mat-icon class="text-sm">east</mat-icon>
              </div>
            </div>
          </div>
        </ng-template>
      </ng-container>
    </ng-container>
  </div>
</section>
