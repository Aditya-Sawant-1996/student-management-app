<section class="bg-white dark:bg-gray-800 rounded shadow p-4 flex flex-col gap-4">
	<!-- Search and Add button row -->
	<div class="flex flex-col sm:flex-row sm:items-center gap-2 justify-between">
		<input
			type="text"
			[placeholder]="searchPlaceholder"
			class="flex-1 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 px-3 py-2 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
			(input)="onSearch($any($event.target).value)"
		/>
		<button
			type="button"
			(click)="onAdd()"
			class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium self-end sm:self-auto"
		>
			Add
		</button>
	</div>

	<!-- Table -->
	<div class="overflow-x-auto">
		<table class="min-w-full text-sm">
			<thead>
				<tr class="bg-gray-100 dark:bg-gray-900 text-gray-700 dark:text-gray-200">
					<th
						*ngFor="let h of tableHeaders"
						class="px-4 py-2 text-left"
					>
						{{ h.label }}
					</th>
					<th class="px-4 py-2 text-right">Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr *ngIf="tableData.length === 0">
					<td
						[attr.colspan]="tableHeaders.length + 1"
						class="px-4 py-4 text-center text-gray-500 dark:text-gray-300"
					>
						No data found.
					</td>
				</tr>
				<tr *ngFor="let row of tableData" class="border-t border-gray-200 dark:border-gray-700">
					<td
						*ngFor="let h of tableHeaders"
						class="px-4 py-2 text-gray-800 dark:text-gray-100"
					>
						{{ row[h.field] }}
					</td>
					<td class="px-4 py-2 text-right space-x-2">
						<button
							type="button"
							(click)="onEdit(row)"
							class="px-3 py-1 rounded bg-yellow-500 hover:bg-yellow-600 text-white text-xs font-medium"
						>
							Edit
						</button>
						<button
							type="button"
							(click)="onDelete(row)"
							class="px-3 py-1 rounded bg-red-600 hover:bg-red-700 text-white text-xs font-medium"
						>
							Delete
						</button>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</section>
