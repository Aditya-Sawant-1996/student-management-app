<section class="bg-white dark:bg-gray-800 rounded shadow p-4 flex flex-col gap-4 list-container">
	<!-- Header row: search, pagination, page size and Add button in one line -->
	<div class="flex flex-wrap items-center gap-3 justify-between list-header">
		<div class="flex items-center gap-2">
			<input
				type="text"
				[placeholder]="searchPlaceholder"
				class="search-input rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 px-3 py-2 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
				(input)="onSearch($any($event.target).value)"
			/>
		</div>

		<div
			class="flex items-center space-x-2 text-xs text-gray-600 dark:text-gray-300 pagination-inline"
			*ngIf="total > 0"
		>
			<div>
				Page {{ page }} of {{ totalPages }} ({{ total }} {{ moduleLabel }})
			</div>
			<div class="flex items-center space-x-2">
				<span>Show</span>
				<mat-form-field appearance="outline" class="w-20 text-xs page-size-field">
					<mat-select [value]="limit" (selectionChange)="onLimitChange($event.value)">
						<mat-option *ngFor="let opt of limitOptions" [value]="opt">
							{{ opt }}
						</mat-option>
					</mat-select>
				</mat-form-field>
				<span>per page</span>
				<button
					type="button"
					(click)="onPrevPage()"
					class="px-3 py-1 rounded border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed"
					[disabled]="page <= 1"
				>
					Previous
				</button>
				<button
					type="button"
					(click)="onNextPage()"
					class="px-3 py-1 rounded border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed"
					[disabled]="page >= totalPages"
				>
					Next
				</button>
			</div>
		</div>

		<div class="flex items-center gap-2">
			<button
				type="button"
				*ngIf="showExport"
				[matMenuTriggerFor]="exportMenu"
				class="px-4 py-2 rounded border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-800 dark:text-gray-100 bg-white dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-1"
			>
				<!-- <mat-icon fontIcon="download"></mat-icon> -->
				<span>Export</span>
			</button>
			<mat-menu #exportMenu="matMenu">
				<button mat-menu-item (click)="onExportPdf()">
					<span>Export to PDF</span>
				</button>
				<button mat-menu-item (click)="onExportExcel()">
					<span>Export to Excel</span>
				</button>
			</mat-menu>
			<button
				type="button"
				(click)="onAdd()"
				class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium"
			>
				{{ addButtonLabel }}
			</button>
		</div>
	</div>

	<!-- Table (scrollable area within viewport height) -->
	<div class="overflow-x-auto list-table-wrapper">
		<table class="min-w-full text-sm">
			<thead>
				<tr class="bg-gray-100 dark:bg-gray-900 text-gray-700 dark:text-gray-200">
					<th
						*ngFor="let h of tableHeaders"
						class="px-4 py-2 text-left"
					>
						{{ h.label }}
					</th>
					<th class="px-4 py-2 text-right">Actions</th>
				</tr>
			</thead>
			<tbody>
				<ng-container *ngIf="!loading; else loadingTpl">
					<tr *ngIf="tableData.length === 0">
						<td
							[attr.colspan]="tableHeaders.length + 1"
							class="px-4 py-4 text-center text-gray-500 dark:text-gray-300"
						>
							No data found.
						</td>
					</tr>
					<tr *ngFor="let row of tableData" class="border-t border-gray-200 dark:border-gray-700">
						<td
							*ngFor="let h of tableHeaders"
							class="px-4 py-2 text-gray-800 dark:text-gray-100"
							[matTooltip]="h.tooltipField ? row[h.tooltipField] : null"
						>
							{{ row[h.field] }}
						</td>
						<td class="px-4 py-2 text-right space-x-2">
							<button
								*ngIf="showViewAction"
								type="button"
								(click)="onView(row)"
								class="px-3 py-1 rounded bg-blue-500 hover:bg-blue-600 text-white text-xs font-medium align-middle"
							>
								<mat-icon>visibility</mat-icon>
							</button>
							<button
								*ngIf="showEditAction"
								type="button"
								(click)="onEdit(row)"
								class="px-3 py-1 rounded bg-yellow-500 hover:bg-yellow-600 text-white text-xs font-medium align-middle"
							>
								<mat-icon>edit</mat-icon>
							</button>
							<button
								*ngIf="showDeleteAction"
								type="button"
								(click)="onDelete(row)"
								class="px-3 py-1 rounded bg-red-600 hover:bg-red-700 text-white text-xs font-medium align-middle"
							>
								<mat-icon>delete</mat-icon>
							</button>
						</td>
					</tr>
				</ng-container>
			</tbody>
		</table>
	</div>

	<ng-template #loadingTpl>
		<tr>
			<td
				[attr.colspan]="tableHeaders.length + 1"
				class="px-4 py-8 text-center text-gray-500 dark:text-gray-300"
			>
				<mat-progress-spinner
					mode="indeterminate"
					diameter="32"
					strokeWidth="4"
				></mat-progress-spinner>
			</td>
		</tr>
	</ng-template>

</section>
