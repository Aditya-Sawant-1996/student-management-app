<section class="rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm p-5 flex flex-col gap-4 list-container">
  <div class="flex flex-wrap items-center justify-between gap-4 list-header">
    <div class="flex flex-wrap items-center gap-3">
      <div class="relative">
        <mat-icon class="absolute left-3 top-2.5 text-gray-400 dark:text-gray-500">search</mat-icon>
        <input
          type="text"
          [placeholder]="searchPlaceholder"
          class="search-input w-full rounded-full border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950 pl-10 pr-4 py-2 text-sm text-gray-800 dark:text-gray-100 focus:border-sky-500 focus:outline-none"
          (input)="onSearch($any($event.target).value)"
        />
      </div>
      <div
        class="flex flex-wrap items-center gap-2 text-xs text-gray-500 dark:text-gray-400"
        *ngIf="total > 0"
      >
        <span class="rounded-full bg-gray-100 dark:bg-gray-800 px-3 py-1 font-semibold uppercase tracking-widest text-[10px]">
          Page {{ page }} of {{ totalPages }}
        </span>
        <span>{{ total }} {{ moduleLabel }}</span>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <div
        class="flex flex-nowrap items-center gap-2 text-xs text-gray-500 dark:text-gray-400 pagination-inline"
        *ngIf="total > 0"
      >
        <span>Show</span>
        <mat-form-field appearance="outline" class="w-20 text-xs page-size-field">
          <mat-select [value]="limit" (selectionChange)="onLimitChange($event.value)">
            <mat-option *ngFor="let opt of limitOptions" [value]="opt">
              {{ opt }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <span>per page</span>
        <button
          type="button"
          (click)="onPrevPage()"
          class="px-3 py-1 rounded-full border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="page <= 1"
        >
          Previous
        </button>
        <button
          type="button"
          (click)="onNextPage()"
          class="px-3 py-1 rounded-full border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="page >= totalPages"
        >
          Next
        </button>
      </div>

      <button
        type="button"
        *ngIf="showExport"
        [matMenuTriggerFor]="exportMenu"
        class="inline-flex items-center gap-2 rounded-full border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950 px-4 py-2 text-xs font-semibold text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
      >
        <mat-icon class="text-sm">download</mat-icon>
        Export
      </button>
      <mat-menu #exportMenu="matMenu">
        <button mat-menu-item (click)="onExportPdf()">
          <span>Export to PDF</span>
        </button>
        <button mat-menu-item (click)="onExportExcel()">
          <span>Export to Excel</span>
        </button>
      </mat-menu>
      <button
        type="button"
        (click)="onAdd()"
        class="inline-flex items-center gap-2 rounded-full bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 text-xs font-semibold transition-colors"
      >
        <mat-icon class="text-sm">add</mat-icon>
        {{ addButtonLabel }}
      </button>
    </div>
  </div>

  <div class="overflow-x-auto list-table-wrapper rounded-xl border border-gray-200 dark:border-gray-700">
    <table class="min-w-full text-sm">
      <thead>
        <tr class="bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-xs uppercase tracking-widest">
          <th
            *ngFor="let h of tableHeaders"
            class="px-4 py-3 text-left font-semibold"
          >
            {{ h.label }}
          </th>
          <th class="px-4 py-3 text-right font-semibold">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
        <ng-container *ngIf="!loading; else loadingTpl">
          <tr *ngIf="tableData.length === 0">
            <td
              [attr.colspan]="tableHeaders.length + 1"
              class="px-4 py-6 text-center text-gray-500 dark:text-gray-400"
            >
              No data found.
            </td>
          </tr>
          <tr
            *ngFor="let row of tableData"
            class="text-gray-800 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-800/60 transition-colors"
          >
            <td
              *ngFor="let h of tableHeaders"
              class="px-4 py-3"
              [matTooltip]="h.tooltipField ? row[h.tooltipField] : null"
            >
              {{ row[h.field] }}
            </td>
            <td class="px-4 py-3 text-right">
              <div class="inline-flex items-center gap-2">
              <button
                *ngIf="showViewAction"
                type="button"
                (click)="onView(row)"
                class="inline-flex items-center justify-center rounded-full border border-sky-200 bg-sky-50 text-sky-700 hover:bg-sky-100 dark:border-sky-700 dark:bg-sky-900/40 dark:text-sky-200 text-xs font-semibold px-3 py-1"
              >
                <mat-icon class="text-sm">visibility</mat-icon>
              </button>
              <button
                *ngIf="showPrintAction"
                type="button"
                (click)="onPrint(row)"
                class="inline-flex items-center justify-center rounded-full border border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 dark:border-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-200 text-xs font-semibold px-3 py-1"
              >
                <mat-icon class="text-sm">print</mat-icon>
              </button>
              <button
                *ngIf="showEditAction"
                type="button"
                (click)="onEdit(row)"
                class="inline-flex items-center justify-center rounded-full border border-amber-200 bg-amber-50 text-amber-700 hover:bg-amber-100 dark:border-amber-700 dark:bg-amber-900/40 dark:text-amber-200 text-xs font-semibold px-3 py-1"
              >
                <mat-icon class="text-sm">edit</mat-icon>
              </button>
              <button
                *ngIf="showDeleteAction"
                type="button"
                (click)="onDelete(row)"
                class="inline-flex items-center justify-center rounded-full border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100 dark:border-rose-700 dark:bg-rose-900/40 dark:text-rose-200 text-xs font-semibold px-3 py-1"
              >
                <mat-icon class="text-sm">delete</mat-icon>
              </button>
              </div>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>

  <ng-template #loadingTpl>
    <tr>
      <td
        [attr.colspan]="tableHeaders.length + 1"
        class="px-4 py-8 text-center text-gray-500 dark:text-gray-300"
      >
        <mat-progress-spinner
          mode="indeterminate"
          diameter="32"
          strokeWidth="4"
        ></mat-progress-spinner>
      </td>
    </tr>
  </ng-template>
</section>
