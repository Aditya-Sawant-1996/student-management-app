<div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg w-full max-w-sm">
  <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">
      {{ isEdit ? 'Edit Subject' : 'Add Subject' }}
    </h3>
    <button
      type="button"
      (click)="onClose()"
      class="text-gray-500 hover:text-gray-700 dark:text-gray-300 dark:hover:text-white"
    >
      ✕
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="px-4 py-4 space-y-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">
          Subject Name<span class="text-red-500 dark:text-red-400 font-semibold">*</span>
        </label>
        <mat-form-field appearance="outline" class="w-full text-sm">
          <input matInput formControlName="subjectName" />
        </mat-form-field>
        <p
          class="mt-1 text-xs text-red-500"
          *ngIf="form.get('subjectName')?.invalid && (form.get('subjectName')?.touched || submitted)"
        >
          Subject name is required.
        </p>
      </div>

    <p
      class="text-xs text-red-500"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </p>
    </div>

    <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-2">
      <button
        type="button"
        (click)="onClose()"
        class="px-4 py-2 rounded border border-gray-300 dark:border-gray-600 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="loading"
        class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium disabled:opacity-50"
      >
        {{ isEdit ? 'Update' : 'Save' }}
      </button>
    </div>
  </form>
</div>
