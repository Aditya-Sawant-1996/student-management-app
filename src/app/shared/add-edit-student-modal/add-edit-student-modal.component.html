<div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg w-full max-w-lg">
	<!-- Modal Header -->
	<div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700">
		<h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">
			{{ isEdit ? 'Edit Student' : 'Add Student' }}
		</h3>
		<button
			type="button"
			(click)="onClose()"
			class="text-gray-500 hover:text-gray-700 dark:text-gray-300 dark:hover:text-white"
		>
			✕
		</button>
	</div>

	<form [formGroup]="form" (ngSubmit)="onSubmit()">
		<!-- Modal Content -->
		<div class="px-4 py-4 space-y-4 overflow-y-auto h-[calc(100vh-200px)]">
				<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
					<div>
						<label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">
							First Name<span class="text-red-500">*</span>
						</label>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<input
								matInput
								formControlName="firstName"
								placeholder="First name"
							/>
						</mat-form-field>
						<p
							class="mt-1 text-xs text-red-500"
							*ngIf="form.get('firstName')?.invalid && (form.get('firstName')?.touched || submitted)"
						>
							First name is required.
						</p>
					</div>
					<div>
						<label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">
							Middle Name
						</label>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<input
								matInput
								formControlName="middleName"
								placeholder="Middle name (optional)"
							/>
						</mat-form-field>
					</div>
					<div>
						<label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">
							Last Name<span class="text-red-500">*</span>
						</label>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<input
								matInput
								formControlName="lastName"
								placeholder="Last name"
							/>
						</mat-form-field>
						<p
							class="mt-1 text-xs text-red-500"
							*ngIf="form.get('lastName')?.invalid && (form.get('lastName')?.touched || submitted)"
						>
							Last name is required.
						</p>
					</div>
					<div>
						<label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">
							Full Name (Marathi, as per Aadhaar)
						</label>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<input
								matInput
								formControlName="fullNameMarathi"
								placeholder="मराठीतील पूर्ण नाव (ऐच्छिक)"
							/>
						</mat-form-field>
					</div>
				</div>

				<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
					<div>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<mat-label class="text-xs font-medium text-gray-600 dark:text-gray-300">
								Gender<span class="text-red-500">*</span>
							</mat-label>
							<mat-select formControlName="gender" placeholder="Select gender">
								<mat-option *ngFor="let g of genders" [value]="g.value">
									{{ g.name }}
								</mat-option>
							</mat-select>
						</mat-form-field>
						<p
							class="mt-1 text-xs text-red-500"
							*ngIf="form.get('gender')?.invalid && (form.get('gender')?.touched || submitted)"
						>
							Gender is required.
						</p>
					</div>
					<div>
						<label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">
							Date of Birth<span class="text-red-500">*</span>
						</label>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<input
								matInput
								[matDatepicker]="dobPicker"
								formControlName="dateOfBirth"
								placeholder="Select date of birth"
							/>
							<mat-datepicker-toggle matSuffix [for]="dobPicker"></mat-datepicker-toggle>
							<mat-datepicker #dobPicker></mat-datepicker>
						</mat-form-field>
						<p
							class="mt-1 text-xs text-red-500"
							*ngIf="form.get('dateOfBirth')?.invalid && (form.get('dateOfBirth')?.touched || submitted)"
						>
							Date of birth is required.
						</p>
					</div>
				</div>

				<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
					<div>
						<label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">
							Age (auto-calculated)
						</label>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<input
								matInput
								type="number"
								formControlName="age"
								placeholder="Age"
								readonly
							/>
						</mat-form-field>
						<p
							class="mt-1 text-xs text-red-500"
							*ngIf="form.get('age')?.errors && (form.get('age')?.touched || submitted)"
						>
							<span *ngIf="form.get('age')?.errors?.['required']">Age is required.</span>
							<span *ngIf="form.get('age')?.errors?.['min']">Age must be at least 1.</span>
						</p>
					</div>
					<div>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<mat-label class="text-xs font-medium text-gray-600 dark:text-gray-300">
								Blood Group
							</mat-label>
							<mat-select formControlName="bloodGroup" placeholder="Select blood group">
								<mat-option [value]="''">None</mat-option>
								<mat-option *ngFor="let bg of bloodGroups" [value]="bg">
									{{ bg }}
								</mat-option>
							</mat-select>
						</mat-form-field>
					</div>
				</div>

				<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
					<div>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<mat-label class="text-xs font-medium text-gray-600 dark:text-gray-300">
								Nationality
							</mat-label>
							<mat-select formControlName="nationality" placeholder="Select nationality">
								<mat-option *ngFor="let n of nationalities" [value]="n">
									{{ n }}
								</mat-option>
							</mat-select>
						</mat-form-field>
					</div>
					<div>
						<label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">
							Class<span class="text-red-500">*</span>
						</label>
						<mat-form-field appearance="outline" class="w-full text-sm">
							<input
								matInput
								formControlName="class"
								placeholder="Class"
							/>
						</mat-form-field>
						<p
							class="mt-1 text-xs text-red-500"
							*ngIf="form.get('class')?.invalid && (form.get('class')?.touched || submitted)"
						>
							Class is required.
						</p>
					</div>
				</div>
		</div>

		<!-- Modal Footer -->
		<div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-2">
			<button
				type="button"
				(click)="onClose()"
				class="px-4 py-2 rounded border border-gray-300 dark:border-gray-600 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
			>
				Cancel
			</button>
			<button
				type="submit"
				class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium disabled:opacity-60 disabled:cursor-not-allowed"
				[disabled]="(form.invalid && (form.touched || submitted)) || loading"
			>
				Save
			</button>
		</div>
	</form>
</div>
