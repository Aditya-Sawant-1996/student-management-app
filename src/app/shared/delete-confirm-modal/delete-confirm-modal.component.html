<div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg w-full max-w-sm">
  <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">
      Confirm Delete
    </h3>
    <button
      type="button"
      (click)="onNo()"
      class="text-gray-500 hover:text-gray-700 dark:text-gray-300 dark:hover:text-white"
    >
      ✕
    </button>
  </div>

  <div class="px-4 py-4">
    <p class="text-sm text-gray-700 dark:text-gray-200">
      {{ message }}
    </p>
  </div>

  <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-2">
    <button
      type="button"
      (click)="onNo()"
      class="px-4 py-2 rounded border border-gray-300 dark:border-gray-600 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
    >
      No
    </button>
    <button
      type="button"
      (click)="onYes()"
      class="px-4 py-2 rounded bg-red-600 hover:bg-red-700 text-white text-sm font-medium"
    >
      Yes
    </button>
  </div>
</div>
