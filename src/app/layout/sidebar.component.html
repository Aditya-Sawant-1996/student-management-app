<aside class="w-64 flex flex-col min-h-screen relative bg-white text-gray-900 dark:bg-gray-900 dark:text-white">
  <div class="px-4 py-4 border-b border-gray-800">
    <ng-container *ngIf="logoUrl$ | async as logoUrl; else nameOnly">
      <div class="flex items-center gap-3">
        <img
          [src]="logoUrl"
          alt="Institute logo"
          class="h-10 w-10 object-contain"
        />
        <div class="min-w-0 flex-1">
          <div
            class="text-base font-semibold leading-tight truncate"
            [title]="(instituteName$ | async) || 'Student Management'"
          >
            {{ (instituteName$ | async) || 'Student Management' }}
          </div>
        </div>
      </div>
    </ng-container>
    <ng-template #nameOnly>
      <div
        class="text-xl font-semibold truncate"
        [title]="(instituteName$ | async) || 'Student Management'"
      >
        {{ (instituteName$ | async) || 'Student Management' }}
      </div>
    </ng-template>
  </div>
  <nav class="flex-1 px-2 py-4 space-y-2">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-gray-200 dark:bg-gray-800"
      class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
    >
      <mat-icon class="text-gray-700 dark:text-gray-200" fontIcon="dashboard"></mat-icon>
      <span>Dashboard</span>
    </a>
    <a
      routerLink="/student"
      routerLinkActive="bg-gray-200 dark:bg-gray-800"
      class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
    >
      <mat-icon class="text-gray-700 dark:text-gray-200" fontIcon="group"></mat-icon>
      <span>Student</span>
    </a>
    <a
		routerLink="/subject"
		routerLinkActive="bg-gray-200 dark:bg-gray-800"
		class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
    >
		<mat-icon class="text-gray-700 dark:text-gray-200" fontIcon="menu_book"></mat-icon>
		<span>Subject</span>
    </a>
    <a
      routerLink="/fees"
      routerLinkActive="bg-gray-200 dark:bg-gray-800"
      class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
    >
      <mat-icon class="text-gray-700 dark:text-gray-200" fontIcon="payments"></mat-icon>
      <span>Fees</span>
    </a>
  </nav>
  <div class="absolute inset-x-0 bottom-0 px-4 py-4 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
    <button
      type="button"
      (click)="onLogout()"
      class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 rounded transition-colors"
    >
      Logout
    </button>
  </div>
</aside>
