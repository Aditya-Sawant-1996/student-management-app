<header class="h-16 bg-white dark:bg-gray-800 shadow flex items-center justify-between px-6">
  <div class="text-lg font-semibold text-gray-800 dark:text-gray-100">
    {{ currentTitle || 'Dashboard' }}
  </div>
  <div class="relative" (click)="$event.stopPropagation()">
    <button
      type="button"
      (click)="toggleMenu($event)"
      class="group inline-flex items-center gap-2 rounded-full border border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-gray-800/80 px-2.5 py-1.5 shadow-sm hover:shadow-md transition-all"
      aria-label="Open user menu"
    >
      <span class="relative inline-flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-amber-400 via-rose-400 to-fuchsia-500 text-white shadow-inner">
        <span class="text-sm font-semibold">{{ userInitial }}</span>
        <span class="absolute -bottom-0.5 -right-0.5 h-3 w-3 rounded-full bg-emerald-400 ring-2 ring-white dark:ring-gray-800"></span>
      </span>
      <mat-icon class="text-gray-500 dark:text-gray-300 transition-transform group-hover:translate-y-0.5">expand_more</mat-icon>
    </button>

    <div
      *ngIf="isMenuOpen"
      class="absolute right-0 mt-3 w-72 overflow-hidden rounded-2xl border border-white/60 dark:border-gray-700/60 bg-white/90 dark:bg-gray-900/90 backdrop-blur-xl shadow-xl ring-1 ring-black/5"
    >
      <div class="px-4 py-3 border-b border-gray-100/80 dark:border-gray-800/80">
        <div class="text-[11px] uppercase tracking-widest text-gray-500 dark:text-gray-400">Signed in as</div>
        <div class="mt-1 text-sm font-semibold text-gray-800 dark:text-gray-100">
          {{ userName }}
        </div>
      </div>

      <div class="p-4 space-y-4">
        <div>
          <div class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2">Appearance</div>
          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              (click)="setTheme('light')"
              class="flex items-center justify-center gap-1.5 rounded-xl border px-3 py-2 text-xs font-semibold transition-all"
              [class.border-amber-300]="!isDark"
              [class.bg-amber-50]="!isDark"
              [class.text-amber-700]="!isDark"
              [class.border-gray-200]="isDark"
              [class.text-gray-600]="isDark"
              [class.dark:border-gray-700]="isDark"
              [class.dark:text-gray-300]="isDark"
            >
              <mat-icon class="text-sm">light_mode</mat-icon>
              Light
            </button>
            <button
              type="button"
              (click)="setTheme('dark')"
              class="flex items-center justify-center gap-1.5 rounded-xl border px-3 py-2 text-xs font-semibold transition-all"
              [class.border-indigo-400]="isDark"
              [class.bg-indigo-500]="isDark"
              [class.text-white]="isDark"
              [class.border-gray-200]="!isDark"
              [class.text-gray-600]="!isDark"
              [class.dark:border-gray-700]="!isDark"
              [class.dark:text-gray-300]="!isDark"
            >
              <mat-icon class="text-sm">dark_mode</mat-icon>
              Dark
            </button>
          </div>
        </div>

        <button
          type="button"
          class="w-full inline-flex items-center justify-between rounded-xl border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-gray-800/70 px-4 py-3 text-sm font-semibold text-gray-700 dark:text-gray-200 hover:bg-white dark:hover:bg-gray-800 transition-colors"
        >
          <span>Settings</span>
          <mat-icon class="text-base">settings</mat-icon>
        </button>
      </div>
    </div>
  </div>
</header>
