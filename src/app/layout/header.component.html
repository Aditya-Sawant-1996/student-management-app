<header class="h-16 bg-white dark:bg-gray-800 shadow flex items-center justify-between px-6">
  <div class="text-lg font-semibold text-gray-800 dark:text-gray-100">
    {{ currentTitle || 'Dashboard' }}
  </div>
  <div class="flex items-center space-x-4">
    <button
      type="button"
      (click)="toggleTheme()"
      class="inline-flex items-center justify-center w-9 h-9 rounded-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors"
      aria-label="Toggle theme"
    >
      <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <span class="text-sm text-gray-600 dark:text-gray-300">Welcome</span>
  </div>
</header>
